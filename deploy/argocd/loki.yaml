# Loki Application. 첫 등록은 automated 블록을 떼고(수동) diff 확인 후 자동 전환 — deploy/monitoring/README.md 참조.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.5.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/deploy/monitoring/loki-values.yaml
    - repoURL: https://github.com/So1ky/Cloud-Automation-Chatbot.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
