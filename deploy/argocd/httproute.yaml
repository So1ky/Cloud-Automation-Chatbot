# argocd.cloudinfra.help → argocd-server(HTTP 80). cac-gateway의 https-argocd 리스너에만 붙는다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: cac-gateway
      namespace: cac
      sectionName: https-argocd
  hostnames:
    - argocd.cloudinfra.help
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
