apiVersion: v1
kind: ConfigMap
metadata:
  name: cac-config
  namespace: cac
data:
  # 게이트웨이 동일 오리진 배포 기준
  FRONTEND_URL: "https://cloudinfra.help"
  # OAuth 콜백 — 프로바이더 콘솔에 등록된 URL과 정확히 일치해야 함
  GITHUB_REDIRECT_URI: "https://cloudinfra.help/api/user/oauth/github/callback"
  GOOGLE_REDIRECT_URI: "https://cloudinfra.help/api/user/oauth/google/callback"
  KAKAO_REDIRECT_URI: "https://cloudinfra.help/api/user/oauth/kakao/callback"
  # HTTPS 배포이므로 인증 쿠키에 Secure 플래그 부여 (로컬 http 개발은 기본값 false)
  COOKIE_SECURE: "true"
  # 로컬 .env와 동일한 에이전트별 모델 구성 (RAG 등 부가 작업은 기본값 gpt-4o-mini)
  AI_MODEL_DESIGN: "gpt-5.6-luna"
  AI_MODEL_DEVELOP: "gpt-5.6-luna"
  AI_MODEL_VERIFY: "gpt-5.6-luna"
