# Argo CD가 보는 진입점. 여기 나열된 파일만 클러스터에 동기화된다.
# secrets.yaml은 의도적으로 제외(gitignore, 수동 kubectl apply). kind/ 는 로컬 kind 전용.
# images.newTag는 CI(.github/workflows/ci.yml)가 빌드 후 봇 커밋으로 갱신한다 — 손으로 고치지 말 것.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass-ebs.yaml
  - efs-rag-assets.yaml
  - configmap.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - gateway.yaml
  - cert-manager.yaml

images:
  - name: 509149464672.dkr.ecr.ap-northeast-2.amazonaws.com/cloud-automation-chatbot/backend
    newTag: 0.1.2
  - name: 509149464672.dkr.ecr.ap-northeast-2.amazonaws.com/cloud-automation-chatbot/frontend
    newTag: 0.1.0
