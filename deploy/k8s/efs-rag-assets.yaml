# RAG 자산(chroma_db + PDF)용 EFS 공유 볼륨 — CSI 드라이버 없이 기본 nfs 타입 static PV.
# server는 terraform output efs_dns_name. 노드에 nfs-common 필요(user_data.sh).
# ※ 원래 클러스터에 수동 적용돼 있던 것을 git(Argo CD 관리)으로 편입. 값은 live와 대조 완료 후 확정.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rag-assets-efs
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - rsize=1048576
    - wsize=1048576
    - hard
    - timeo=600
    - retrans=2
    - noresvport
  nfs:
    server: fs-075591b9df3af93a8.efs.ap-northeast-2.amazonaws.com
    path: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-assets
  namespace: cac
spec:
  storageClassName: ""
  volumeName: rag-assets-efs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
