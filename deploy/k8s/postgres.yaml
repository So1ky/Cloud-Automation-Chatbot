apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cac
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cac
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: cac
            - name: POSTGRES_DB
              value: cac
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cac-secrets
                  key: POSTGRES_PASSWORD
            # 데이터 디렉터리를 서브디렉터리로 (볼륨 루트의 lost+found 충돌 방지)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cac", "-d", "cac"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cac", "-d", "cac"]
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: standard
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
