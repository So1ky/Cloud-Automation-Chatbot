# postgres PVC용 EBS gp3 StorageClass. EBS CSI 드라이버(kube-system)가 PVC를 보고
# 볼륨을 만든다. WaitForFirstConsumer: 파드가 스케줄된 노드의 AZ에 볼륨을 만들기 위함.
# ※ 원래 클러스터에 수동 적용돼 있던 것을 git(Argo CD 관리)으로 편입. 값은 live와 대조 완료 후 확정.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
