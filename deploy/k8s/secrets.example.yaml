# 실제 값을 채워 secrets.yaml로 복사해 적용할 것. secrets.yaml은 절대 커밋 금지(.gitignore 등록됨)
# cp deploy/k8s/secrets.example.yaml deploy/k8s/secrets.yaml && (값 채우기) && kubectl apply -f deploy/k8s/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: cac-secrets
  namespace: cac
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-..."
  # 배포용 신규 발급: python -c "import secrets; print(secrets.token_hex(32))"
  SECRET_KEY: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  # POSTGRES_PASSWORD와 동일한 비밀번호 사용.
  # 드라이버(+psycopg2) 명시 필수 — SQLAlchemy 2.1부터 기본 드라이버가 psycopg(v3)로 바뀌어
  # 미명시 시 이미지에 없는 모듈을 찾다 기동 실패한다.
  DATABASE_URL: "postgresql+psycopg2://cac:CHANGE_ME@postgres:5432/cac"
  # 비용 분석용 — infracost 대시보드의 CLI token (v2 비대화형 인증)
  INFRACOST_CLI_AUTHENTICATION_TOKEN: "..."
  # OAuth 소셜 로그인 — 각 프로바이더 콘솔에서 발급 (콜백 URL은 configmap의 *_REDIRECT_URI와 일치해야 함)
  GITHUB_CLIENT_ID: "CHANGE_ME"
  GITHUB_CLIENT_SECRET: "CHANGE_ME"
  GOOGLE_CLIENT_ID: "CHANGE_ME"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"
  # Kakao는 "REST API 키"가 CLIENT_ID. SECRET은 보안 탭에서 활성화한 경우에만 (미사용 시 빈 문자열)
  KAKAO_CLIENT_ID: "CHANGE_ME"
  KAKAO_CLIENT_SECRET: ""
