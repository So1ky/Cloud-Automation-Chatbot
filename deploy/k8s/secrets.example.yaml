# 실제 값을 채워 secrets.yaml로 복사해 적용할 것. secrets.yaml은 절대 커밋 금지(.gitignore 등록됨)
# cp deploy/k8s/secrets.example.yaml deploy/k8s/secrets.yaml && (값 채우기) && kubectl apply -f deploy/k8s/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: cac-secrets
  namespace: cac
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-..."
  # 배포용 신규 발급: python -c "import secrets; print(secrets.token_hex(32))"
  SECRET_KEY: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  # POSTGRES_PASSWORD와 동일한 비밀번호 사용
  DATABASE_URL: "postgresql://cac:CHANGE_ME@postgres:5432/cac"
  # 비용 분석용 — infracost 대시보드의 CLI token (v2 비대화형 인증)
  INFRACOST_CLI_AUTHENTICATION_TOKEN: "..."
