# metrics-server — kubectl top / HPA용 리소스 메트릭 API.
# kubeadm kubelet 인증서는 자체 서명이라 --kubelet-insecure-tls 없이는 스크랩 실패.
# 배치는 다른 모니터링 컴포넌트와 같이 worker-2 고정(이유는 kube-prometheus-stack-values.yaml 머리말).
args:
  - --kubelet-insecure-tls
nodeSelector:
  kubernetes.io/hostname: ip-10-0-1-12
resources:
  requests:
    cpu: 50m
    memory: 50Mi
  limits:
    memory: 100Mi
