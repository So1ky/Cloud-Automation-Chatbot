# loki 7.5.0 — 단일 바이너리, 로컬 파일시스템, 7일 보존. 분산 모드 컴포넌트·캐시·게이트웨이·canary 전부 off.
# 배치는 worker-2 고정(이유는 kube-prometheus-stack-values.yaml 머리말).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ebs-gp3
  nodeSelector:
    kubernetes.io/hostname: ip-10-0-1-12
  resources:
    requests:
      cpu: 50m
      memory: 200Mi
    limits:
      memory: 400Mi

# 룰 사이드카 비활성화 — Loki 룰을 쓰지 않고, 켜 두면 클러스터 전체 configmaps/secrets 읽기 권한이 ClusterRole에 생긴다.
sidecar:
  rules:
    enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
