# 실제 값을 채워 secrets.yaml로 복사해 적용할 것. secrets.yaml은 절대 커밋 금지(.gitignore 등록됨)
# kubectl create namespace monitoring
# cp deploy/monitoring/secrets.example.yaml deploy/monitoring/secrets.yaml && (값 채우기) && kubectl apply -f deploy/monitoring/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  # python -c "import secrets; print(secrets.token_urlsafe(16))"
  admin-password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-discord
  namespace: monitoring
type: Opaque
stringData:
  # Discord 채널 설정 → 연동 → 웹후크 → 새 웹후크 → URL 복사. 유출 시 Discord에서 재발급.
  webhook-url: "https://discord.com/api/webhooks/CHANGE_ME"
